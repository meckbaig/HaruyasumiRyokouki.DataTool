[project]
name = "haru-analysis"
version = "0.1.0"
description = "Local analysis of trip photos and videos: file index, video frames, machine tags, image embeddings"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "numpy>=1.26",
    "httpx>=0.27",
    # Model backends for embed. Imported lazily, so unit tests never load them.
    "transformers>=4.45,<6",
    "torch>=2.4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
haru-analysis = "haru_analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires real models or data outside the repository; run with -m integration",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["haru_analysis"]
